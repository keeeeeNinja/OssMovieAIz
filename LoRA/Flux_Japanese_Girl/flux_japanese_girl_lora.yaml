job: extension
config:
  name: "flux_japanese_girl_v1"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/output/flux_japanese_girl_lora"
      device: cuda:0
      trigger_word: "ohwx woman"
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 500
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/workspace/datasets/Flux_Japanese_Girl"
          image_size: [512, 512]
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          is_regularization: false
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        lr_scheduler: "constant"
        max_grad_norm: 1.0
        dtype: bf16
        ema_config:
          use_ema: true
          ema_decay: 0.99
      model:
        name_or_path: "/workspace/models/flux_dev"
        is_flux: true
        quantize: true
      sample:
        sampler: "flowmatch"
        sample_every: 500
        width: 512
        height: 512
        prompts:
          - "ohwx woman, portrait photo, white background, looking at camera"
          - "ohwx woman, full body, standing, white background"
          - "ohwx woman, smiling, upper body, natural light"
        neg: ""
        seed: 42
        walk_seed: true
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: "1.0"
