name: Build Serverless TTS Image

on:
  push:
    branches: [master]
    tags:
      - 'tts-v*'
    paths:
      - 'docker/Dockerfile.tts'
      - 'docker/handler_tts.py'
      - '.github/workflows/build-tts-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space on runner
        # Qwen3-TTS image はモデル本体は焼かないが、torch + cuda + flash-attn ビルドで
        # 14GB ランナーが逼迫するため事前に不要ツールを削除
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /opt/ghc \
                      /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ossmovie-tts
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.tts
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
