name: Build Serverless ComfyUI Image

on:
  push:
    branches: [master]
    tags:
      - 'v*'
    paths:
      - 'docker/**'
      - '.github/workflows/build-serverless-image.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space on runner
        # base image (worker-comfyui) ≈ 数 GB + pip install + buildx cache で
        # 標準 14GB ランナーを使い切るため、不要な pre-installed ツールを削除
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android \
                      /opt/ghc \
                      /usr/share/dotnet \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/local/share/powershell \
                      /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ossmovie-comfyui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serverless
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min でキャッシュ容量を抑える（max はディスク逼迫の原因）
          cache-to: type=gha,mode=min
